<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Đăng ký học viên</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #eef2ff;
        margin: 0;
        padding: 30px 15px;
      }

      .container {
        max-width: 600px;
        margin: auto;
        padding: 25px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 0 12px #cbd5e1;
      }

      h2 {
        text-align: center;
        color: #4338ca;
      }

      .field {
        margin-bottom: 15px;
      }

      .field > label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="date"],
      select,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 5px;
      }

      .options label {
        margin-right: 15px;
        line-height: 2;
      }

      textarea {
        resize: vertical;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .submit {
        background-color: #4338ca;
        color: white;
      }

      .reset {
        background-color: #e5e7eb;
        margin-left: 8px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Form đăng ký học viên</h2>

      <form action="#" method="get">
        <div class="field">
          <label for="fullname">Họ và tên:</label>
          <input type="text" id="fullname" name="fullname" required />
        </div>

        <div class="field">
          <label for="student-email">Email:</label>
          <input type="email" id="student-email" name="email" required />
        </div>

        <div class="field">
          <label for="phone">Số điện thoại:</label>
          <input type="tel" id="phone" name="phone" />
        </div>

        <div class="field">
          <label for="birthday">Ngày sinh:</label>
          <input type="date" id="birthday" name="birthday" />
        </div>

        <div class="field">
          <label>Giới tính:</label>
          <div class="options">
            <label><input type="radio" name="gender" value="male" /> Nam</label>
            <label
              ><input type="radio" name="gender" value="female" /> Nữ</label
            >
            <label
              ><input type="radio" name="gender" value="other" /> Khác</label
            >
          </div>
        </div>

        <div class="field">
          <label for="address">Địa chỉ:</label>
          <textarea id="address" name="address" rows="3"></textarea>
        </div>

        <div class="field">
          <label for="course">Khóa học:</label>
          <select id="course" name="course" required>
            <option value="">-- Chọn khóa học --</option>
            <option value="html-css">HTML &amp; CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="java">Java</option>
            <option value="python">Python</option>
          </select>
        </div>

        <div class="field">
          <label>Hình thức học:</label>
          <div class="options">
            <label
              ><input type="radio" name="study_type" value="online" />
              Online</label
            >
            <label
              ><input type="radio" name="study_type" value="offline" />
              Offline</label
            >
          </div>
        </div>

        <div class="field">
          <label>Sở thích:</label>
          <div class="options">
            <label
              ><input type="checkbox" name="hobby" value="music" /> Âm
              nhạc</label
            >
            <label
              ><input type="checkbox" name="hobby" value="sports" /> Thể
              thao</label
            >
            <label
              ><input type="checkbox" name="hobby" value="reading" /> Đọc
              sách</label
            >
          </div>
        </div>

        <div class="field">
          <label for="note">Ghi chú:</label>
          <textarea
            id="note"
            name="note"
            rows="3"
            placeholder="Nhập ghi chú nếu có"
          ></textarea>
        </div>

        <button type="submit" class="submit">Đăng ký</button>
        <button type="reset" class="reset">Nhập lại</button>
      </form>
    </div>
  </body>
</html>
